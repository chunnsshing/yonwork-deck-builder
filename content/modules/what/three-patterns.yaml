zh:
  eyebrow: 实际是什么样
  heading: 三种帮助
  cards:
  - {n: 1, title: 先问再做, what: 一条消息或一份文档 → 系统中的草稿, body: 由您掌控。创建任何内容前，它都会先和您确认。, tag: 数字分身}
  - {n: 2, title: 包揽日常事务, what: 收到的邮件 → 待审批的单据, body: 无需吩咐。您只需在最后批准一次。, tag: 数字员工}
  - {n: 3, title: 替您留意, what: 每天早上放在您桌上的报告, body: 提前发现问题。只读取和报告，无需审批。, tag: 数字员工 · 主动}
