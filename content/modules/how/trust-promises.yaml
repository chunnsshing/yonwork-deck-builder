slide:
  eyebrow: On every workflow
  heading: Three promises, every time
  cards:
  - {title: No snooping, body: It only sees what the user is allowed to see.}
  - {title: Nothing changes without your yes, body: 'Anything that creates, changes or sends waits for a person to approve.'}
