zh:
  eyebrow: 在每个工作流上
  heading: 三个承诺，每次都兑现
  cards:
  - {title: 不越权查看, body: 它只能看到该用户有权看到的内容。}
  - {title: 没有您的确认，什么都不会改, body: 任何新建、修改或发送操作，都要等人批准。}
  - {title: 保留每一份记录, body: 每一步都有记录：读了什么、做了什么、谁批准的。}
