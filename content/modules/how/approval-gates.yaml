slide:
  eyebrow: The golden rule
  heading: It asks before it acts.
  lede: Everything in between, it does on its own.
  steps: [Reads the request, Finds it all in your ERP, Creates the draft document, Done]
  gates: ['Are these details right?', 'May I create it?', 'May I send it?']
