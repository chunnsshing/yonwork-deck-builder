slide:
  eyebrow: What it takes to start
  heading: No need to commit to everything. Start with one task.
  steps:
  - {title: Pick one task, body: 'Frequent, repetitive, easy to measure.', highlight: true}
  - {title: Set expectations, body: 'Agree the target, the boundaries, and how we''ll know it worked.'}
  - {title: Trial on real data, body: 'Your documents, your items, your ERP. Weeks, not months.'}
  - {title: Make it official, body: 'Build it properly: a reusable process your whole team can use.'}
  - {title: Grow from there, body: 'Run it, then add the next task. Each one is faster than the last.'}
